name: Run Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: [self-hosted, X64, Linux, ubuntu-24]
    permissions:
      id-token: write
      contents: read
    environment:
      name: ci

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup runtime
        uses: Alliander/setup-runtime@04bf359dd49454bfc1d569ba7c6f6263987da22d # v1.3.0
        with:
          runtime: java
          runtime-version: 17
          build-tool: gradle
          build-tool-version: "9.5.1"

      - name: Run tests (Gradle)
        run: ./gradlew :measure:test